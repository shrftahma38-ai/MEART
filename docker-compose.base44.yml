services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: arabzadeh
      POSTGRES_PASSWORD: arabzadeh_dev_pw
      POSTGRES_DB: arabzadeh
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arabzadeh -d arabzadeh"]
      interval: 5s
      timeout: 4s
      retries: 12

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://arabzadeh:arabzadeh_dev_pw@db:5432/arabzadeh?schema=public
      UPLOAD_DIR: /app/uploads
      CHOKIDAR_USEPOLLING: "true"
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    volumes:
      - ./server:/app
      - api_node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        npx prisma generate
        npx prisma db push --skip-generate
        node prisma/seed.js
        exec node --watch src/index.js
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://api:4000
      CHOKIDAR_USEPOLLING: "true"
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-}
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-${BASE44_SANDBOX_HOST_DOMAIN}}
    ports:
      - "3000:5173"
    volumes:
      - ./client:/app
      - web_node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        exec npx vite --host 0.0.0.0 --port 5173
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    labels:
      base44.project: "Arabzadeh Fabric Store"
      base44.kind: web
      base44.port: "3000"

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
