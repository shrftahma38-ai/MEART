# Base44 sandbox development stack for Horizon Properties.
#
# web:      Vite dev server with HMR — the app's only public entry point (host port 3000).
# server:   Express + TypeScript API, restarted/reloaded by tsx watch (port 4000, also published).
# db:       PostgreSQL 16 with a named volume.
# db-setup: one-shot service that applies the schema and seeds the catalogue, then exits.
#
# Everything runs from the cloned sources (bind mounts), never from a prebuilt image, so
# every edit is picked up live. Dependencies are installed at container startup with npm
# into per-service named volumes (never on the host, never in the repo).

name: horizon-properties

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=horizon
      - POSTGRES_PASSWORD=horizon_dev_password
      - POSTGRES_DB=horizon
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: apply the schema and load the property catalogue, then exit.
  db-setup:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://horizon:horizon_dev_password@db:5432/horizon
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && npm run setup"]

  server:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgres://horizon:horizon_dev_password@db:5432/horizon
      # Bare pass-through: builds the CORS allow-list for direct calls to port 4000.
      - BASE44_PUBLIC_HOST_SUFFIX
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    ports:
      - "4000:4000"
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/properties?limit=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    depends_on:
      server:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      # Bare pass-throughs — values come from the sandbox environment, never hardcoded.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      # Vite (>= 6.1) appends this to server.allowedHosts so the proxied preview host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - VITE_API_PROXY_TARGET=http://server:4000
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  db_data:
  server_node_modules:
  client_node_modules:
